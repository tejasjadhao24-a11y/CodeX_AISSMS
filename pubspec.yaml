name: campus_lift
description: "A sustainable campus mobility solution for students to share rides."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  google_fonts: ^6.0.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  google_maps_flutter: ^2.5.3
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.2
  http: ^1.2.1
  socket_io_client: ^3.0.2
  shared_preferences: ^2.2.3
  geolocator: ^11.0.0
  intl: ^0.19.0
  uuid: ^4.3.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.3
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/illustrations/
